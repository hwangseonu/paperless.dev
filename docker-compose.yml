services:
  api:
    build:
      context: ./app/api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://${DB_USER}:${DB_PASSWORD}@db:27017/?authSource=admin
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
    depends_on:
      - redis
      - db
    networks:
      - paperless-network

  web:
    build:
      context: ./app/web
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8080 # 브라우저에서 접근 시
    depends_on:
      - api
    networks:
      - paperless-network

  db:
    image: mongo:8.2.4
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${DB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${DB_PASSWORD}
    networks:
      - paperless-network

  redis:
    image: redis:8.4.0-alpine
    container_name: redis
    ports:
      - 6379:6379
    networks:
      - paperless-network

networks:
  paperless-network:
    driver: bridge